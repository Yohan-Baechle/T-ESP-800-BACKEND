services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: infirmo
      POSTGRES_PASSWORD: infirmo
      POSTGRES_DB: infirmo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infirmo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000

volumes:
  db_data:
